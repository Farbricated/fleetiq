version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-fleetiq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fleetiq_user} -d $${POSTGRES_DB:-fleetiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetiq_user}:${POSTGRES_PASSWORD:-fleetiq_password}@db:5432/${POSTGRES_DB:-fleetiq}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

